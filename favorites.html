<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Traveland - Избранное</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/stylesOfProject.css">
    <style>
        .favorites-page {
            padding: 60px 0;
            background: var(--background-light);
            min-height: calc(100vh - 200px);
        }

        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .favorites-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .clear-favorites {
            background: none;
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .clear-favorites:hover {
            border-color: #ff4757;
            color: #ff4757;
        }

        .favorites-empty {
            text-align: center;
            padding: 80px;
            background: white;
            border-radius: 12px;
            color: var(--text-secondary);
        }

        .favorites-empty i {
            font-size: 64px;
            margin-bottom: 20px;
            color: var(--border-light);
        }

        .favorites-empty p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="favorites-page">
    <div class="page-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> На главную
        </a>

        <div class="section-heading">
            <h2 class="section-heading__title">
                <i class="fas fa-heart" style="color: #ff4757;"></i> Избранные туры
            </h2>
            <p class="section-heading__subtitle">Ваши сохраненные путешествия</p>
        </div>

        <div id="favoritesContent"></div>
    </div>
</div>

<footer class="site-footer">
    <div class="page-container">
        <div class="footer-content" style="justify-content: center; padding-left: 200px;">
            <div class="footer-column">
                <h3 class="footer-column__title">Traveland</h3>
                <p>Мы создаем незабываемые путешествия по всему миру. Откройте для себя новые горизонты с нами.</p>
                <div class="social-links-container">
                    <a href="https://www.facebook.com/" class="social-link"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://x.com/" class="social-link"><i class="fab fa-twitter"></i></a>
                    <a href="https://www.instagram.com/" class="social-link"><i class="fab fa-instagram"></i></a>
                    <a href="https://ru.linkedin.com/" class="social-link"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="footer-column">
                <h3 class="footer-column__title">Контакты</h3>
                <ul class="footer-links-list">
                    <li><a href="#" class="footer-link"><i class="fas fa-map-marker-alt"></i> Минск, ул. Карла Маркса, 32</a></li>
                    <li><a href="#" class="footer-link"><i class="fas fa-phone"></i> +375 (29) 283 88 60</a></li>
                    <li><a href="#" class="footer-link"><i class="fas fa-envelope"></i> info@traveland.ru</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2025 Traveland. Все права защищены.</p>
        </div>
    </div>
</footer>

<script type="module">
    import { getFavoriteTours, removeFromFavorites, saveFavoriteTours } from './js/favorites.js';

    function renderFavorites() {
        const favorites = getFavoriteTours();
        const container = document.getElementById('favoritesContent');

        if (favorites.length === 0) {
            container.innerHTML = `
                <div class="favorites-empty">
                    <i class="far fa-heart"></i>
                    <p>У вас пока нет избранных туров</p>
                    <a href="countries.html" class="action-button action-button--primary">
                        Посмотреть направления
                    </a>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="favorites-header">
                    <h3 class="favorites-title">Сохраненные туры (${favorites.length})</h3>
                    <button class="clear-favorites" id="clearFavoritesBtn">
                        <i class="fas fa-trash-alt"></i> Очистить все
                    </button>
                </div>
                <div class="favorites-grid" id="favoritesGrid"></div>
            `;

            const favoritesGrid = document.getElementById('favoritesGrid');
            favoritesGrid.innerHTML = favorites.map(tour => `
                <div class="destination-card">
                    <div class="destination-image-container">
                        <img src="${tour.imageUrl}" alt="${tour.name}">
                    </div>
                    <div class="destination-details">
                        <h3 class="destination-name">${tour.name}</h3>
                        <div class="destination-location">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>${tour.cityName}, ${tour.countryName}</span>
                        </div>
                        <div class="destination-pricing">
                            <div class="destination-price">$${tour.price}</div>
                            <div class="destination-rating">
                                <i class="fas fa-star"></i>
                                <span>${tour.rating}</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <a href="tour-detail.html?id=${tour.id}" class="action-button action-button--primary" style="flex: 1; text-align: center;">
                                Подробнее
                            </a>
                            <button class="action-button action-button--outline remove-fav-btn" data-id="${tour.id}" style="flex: 0;">
                                <i class="fas fa-trash"></i> Удалить
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.remove-fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const id = parseInt(btn.dataset.id);
                    removeFromFavorites(id);
                    renderFavorites();
                });
            });

            const clearBtn = document.getElementById('clearFavoritesBtn');
            if (clearBtn) {
                clearBtn.onclick = () => {
                    if (confirm('Вы уверены, что хотите удалить все избранные туры?')) {
                        saveFavoriteTours([]);
                        renderFavorites();
                    }
                };
            }
        }
    }

    renderFavorites();
</script>
</body>
</html>
