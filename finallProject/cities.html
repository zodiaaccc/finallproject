<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Traveland - Города</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/stylesOfProject.css">
    <style>
        .cities-page {
            padding: 60px 0;
            background: var(--background-light);
            min-height: calc(100vh - 200px);
        }

        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .city-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .city-card:hover {
            transform: translateY(-5px);
        }

        .city-image {
            height: 200px;
            overflow: hidden;
        }

        .city-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .city-info {
            padding: 20px;
        }

        .city-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .city-desc {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .tour-count {
            color: var(--brand-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .country-header {
            margin-bottom: 30px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            color: var(--brand-primary);
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="cities-page">
    <div class="page-container">
        <a href="countries.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Назад к странам
        </a>

        <div class="country-header">
            <h1 class="section-heading__title" id="countryName"></h1>
            <p class="section-heading__subtitle">Выберите город для путешествия</p>
        </div>

        <div class="cities-grid" id="citiesGrid"></div>
    </div>
</div>

<footer class="site-footer">
    <div class="page-container">
        <div class="footer-content" style="justify-content: center; padding-left: 200px;">
            <div class="footer-column">
                <h3 class="footer-column__title">Traveland</h3>
                <p>Мы создаем незабываемые путешествия по всему миру. Откройте для себя новые горизонты с нами.</p>
                <div class="social-links-container">
                    <a href="https://www.facebook.com/" class="social-link"><i class="fab fa-facebook-f"></i></a>
                    <a href="https://x.com/" class="social-link"><i class="fab fa-twitter"></i></a>
                    <a href="https://www.instagram.com/" class="social-link"><i class="fab fa-instagram"></i></a>
                    <a href="https://ru.linkedin.com/" class="social-link"><i class="fab fa-linkedin-in"></i></a>
                </div>
            </div>

            <div class="footer-column">
                <h3 class="footer-column__title">Контакты</h3>
                <ul class="footer-links-list">
                    <li><a href="#" class="footer-link"><i class="fas fa-map-marker-alt"></i> Минск, ул. Карла Маркса, 32</a></li>
                    <li><a href="#" class="footer-link"><i class="fas fa-phone"></i> +375 (29) 283 88 60</a></li>
                    <li><a href="#" class="footer-link"><i class="fas fa-envelope"></i> info@traveland.ru</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-bottom">
            <p>&copy; 2025 Traveland. Все права защищены.</p>
        </div>
    </div>
</footer>

<script type="module">
    import { destinationsData } from './js/destinationsData.js';

    const urlParams = new URLSearchParams(window.location.search);
    const countryName = urlParams.get('country');
    const country = destinationsData.find(c => c.name === countryName);

    if (!country) {
        window.location.href = 'countries.html';
    }

    document.getElementById('countryName').textContent = country.name;

    function renderCities() {
        const grid = document.getElementById('citiesGrid');

        grid.innerHTML = country.cities.map(city => `
            <a href="tours.html?city=${encodeURIComponent(city.name)}&country=${encodeURIComponent(country.name)}" class="city-card">
                <div class="city-image">
                    <img src="${city.imageUrl}" alt="${city.name}">
                </div>
                <div class="city-info">
                    <h3 class="city-name">${city.name}</h3>
                    <p class="city-desc">${city.description}</p>
                    <div class="tour-count">
                        ${city.toursCount} туров <i class="fas fa-arrow-right"></i>
                    </div>
                </div>
            </a>
        `).join('');
    }

    renderCities();
</script>
</body>
</html>
