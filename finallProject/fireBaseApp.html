<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Traveland - Вход / Регистрация</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/stylesOfProject.css">
    <style>
        /* Минимальные стили для страницы авторизации */
        .auth-page {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7ff;
        }

        .auth-container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 400px;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #1F2A37;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .auth-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
        }

        .auth-form button {
            width: 100%;
            padding: 12px;
            background: #4A6CF7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .auth-form button:hover {
            background: #3A57D4;
        }

        .auth-link {
            text-align: center;
            margin-top: 15px;
        }

        .auth-link a {
            color: #4A6CF7;
            text-decoration: none;
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6B7280;
            text-decoration: none;
        }

        .back-link:hover {
            color: #4A6CF7;
        }
    </style>
</head>
<body>
<header class="site-header">
    <div class="page-container header-content">
        <a href="index.html" class="brand-logo">
            <i class="fas fa-map-marked-alt brand-logo__icon"></i>
            Traveland
        </a>
    </div>
</header>

<div class="auth-page">
    <div class="auth-container">
        <h2>Добро пожаловать!</h2>

        <!-- Форма входа -->
        <form id="loginForm" class="auth-form active">
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Пароль" required>
            <button type="submit">Войти</button>
            <div class="auth-link">
                Нет аккаунта? <a href="#" id="showRegisterLink">Зарегистрироваться</a>
            </div>
        </form>

        <!-- Форма регистрации -->
        <form id="registerForm" class="auth-form">
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Пароль" required>
            <button type="submit">Зарегистрироваться</button>
            <div class="auth-link">
                Уже есть аккаунт? <a href="#" id="showLoginLink">Войти</a>
            </div>
        </form>

        <div id="message" class="message"></div>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> На главную</a>
    </div>
</div>

<script type="module">
    import { auth } from './js/fireBaseConfing.js';
    import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Элементы
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const showRegisterLink = document.getElementById('showRegisterLink');
    const showLoginLink = document.getElementById('showLoginLink');
    const messageDiv = document.getElementById('message');

    // Переключение форм
    showRegisterLink.onclick = (e) => {
        e.preventDefault();
        loginForm.classList.remove('active');
        registerForm.classList.add('active');
        messageDiv.innerHTML = '';
    };

    showLoginLink.onclick = (e) => {
        e.preventDefault();
        registerForm.classList.remove('active');
        loginForm.classList.add('active');
        messageDiv.innerHTML = '';
    };

    // Регистрация
    registerForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
            await createUserWithEmailAndPassword(auth,
                document.getElementById('registerEmail').value,
                document.getElementById('registerPassword').value
            );
            messageDiv.className = 'message success';
            messageDiv.innerText = 'Успешная регистрация!';
            setTimeout(() => location.href = 'index.html', 1000);
        } catch (error) {
            messageDiv.className = 'message error';
            messageDiv.innerText = error.message;
        }
    };

    // Вход
    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        try {
            await signInWithEmailAndPassword(auth,
                document.getElementById('loginEmail').value,
                document.getElementById('loginPassword').value
            );
            messageDiv.className = 'message success';
            messageDiv.innerText = 'Успешный вход!';
            setTimeout(() => location.href = 'index.html', 1000);
        } catch (error) {
            messageDiv.className = 'message error';
            messageDiv.innerText = error.message;
        }
    };
</script>
</body>
</html>
