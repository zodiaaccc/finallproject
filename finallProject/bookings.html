<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Traveland - Мои бронирования</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stylesOfProject.css">
  <style>
    .bookings-page {
      padding: 60px 0;
      background: var(--background-light);
      min-height: calc(100vh - 200px);
    }
    .bookings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 30px;
      margin-top: 40px;
    }
    .booking-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }
    .booking-image {
      height: 180px;
      overflow: hidden;
    }
    .booking-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .booking-info {
      padding: 20px;
    }
    .booking-name {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .booking-location {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 10px;
    }
    .booking-details {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      padding: 10px 0;
      border-top: 1px solid var(--border-light);
      border-bottom: 1px solid var(--border-light);
    }
    .booking-price {
      font-size: 20px;
      font-weight: 700;
      color: var(--brand-primary);
    }
    .booking-date {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 10px;
    }
    .cancel-btn {
      margin-top: 15px;
      background: none;
      border: 1px solid #ff4757;
      color: #ff4757;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
      width: 100%;
    }
    .cancel-btn:hover {
      background: #ff4757;
      color: white;
    }
    .bookings-empty {
      text-align: center;
      padding: 80px;
      background: white;
      border-radius: 12px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 30px;
      color: var(--brand-primary);
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="bookings-page">
  <div class="page-container">
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> На главную
    </a>
    <div class="section-heading">
      <h2 class="section-heading__title">
        <i class="fas fa-calendar-check"></i> Мои бронирования
      </h2>
      <p class="section-heading__subtitle">Ваши забронированные туры</p>
    </div>
    <div id="bookingsContent"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="page-container">
    <div class="footer-content" style="justify-content: center; padding-left: 200px;">
      <div class="footer-column">
        <h3 class="footer-column__title">Traveland</h3>
        <p>Мы создаем незабываемые путешествия по всему миру. Откройте для себя новые горизонты с нами.</p>
        <div class="social-links-container">
          <a href="https://www.facebook.com/" class="social-link"><i class="fab fa-facebook-f"></i></a>
          <a href="https://x.com/" class="social-link"><i class="fab fa-twitter"></i></a>
          <a href="https://www.instagram.com/" class="social-link"><i class="fab fa-instagram"></i></a>
          <a href="https://ru.linkedin.com/" class="social-link"><i class="fab fa-linkedin-in"></i></a>
        </div>
      </div>

      <div class="footer-column">
        <h3 class="footer-column__title">Контакты</h3>
        <ul class="footer-links-list">
          <li><a href="#" class="footer-link"><i class="fas fa-map-marker-alt"></i> Минск, ул. Карла Маркса, 32</a></li>
          <li><a href="#" class="footer-link"><i class="fas fa-phone"></i> +375 (29) 283 88 60</a></li>
          <li><a href="#" class="footer-link"><i class="fas fa-envelope"></i> info@traveland.ru</a></li>
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2025 Traveland. Все права защищены.</p>
    </div>
  </div>
</footer>

<script type="module">
  import { auth } from './js/firebaseConfig.js';
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
  import { getUserBookings, cancelBooking } from './js/bookings.js';

  function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString('ru-RU', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function renderBookings(bookings) {
    const container = document.getElementById('bookingsContent');

    if (bookings.length === 0) {
      container.innerHTML = `
                <div class="bookings-empty">
                    <i class="fas fa-calendar-times" style="font-size: 64px; color: var(--border-light); margin-bottom: 20px;"></i>
                    <p style="font-size: 18px; margin-bottom: 20px;">У вас пока нет бронирований</p>
                    <a href="countries.html" class="action-button action-button--primary">Выбрать тур</a>
                </div>
            `;
      return;
    }

    container.innerHTML = `
            <div class="bookings-grid">
                ${bookings.map(booking => `
                    <div class="booking-card" data-id="${booking.id}">
                        <div class="booking-image">
                            <img src="${booking.imageUrl}" alt="${booking.tourName}">
                        </div>
                        <div class="booking-info">
                            <h3 class="booking-name">${booking.tourName}</h3>
                            <div class="booking-location">
                                <i class="fas fa-map-marker-alt"></i> ${booking.cityName}, ${booking.countryName}
                            </div>
                            <div class="booking-details">
                                <span><i class="fas fa-users"></i> ${booking.peopleCount} чел.</span>
                                <span><i class="fas fa-clock"></i> ${booking.duration} дней</span>
                            </div>
                            <div class="booking-price">$${booking.totalPrice.toLocaleString()}</div>
                            <div class="booking-date">
                                <i class="fas fa-calendar"></i> Забронировано: ${formatDate(booking.date)}
                            </div>
                            <button class="cancel-btn" data-id="${booking.id}">
                                <i class="fas fa-times"></i> Отменить бронирование
                            </button>
                        </div>
                    </div>
                `).join('')}
            </div>
        `;

    document.querySelectorAll('.cancel-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const bookingId = parseInt(btn.dataset.id);
        if (confirm('Вы уверены, что хотите отменить бронирование?')) {
          const user = auth.currentUser;
          if (user) {
            cancelBooking(bookingId, user.uid);
            const updatedBookings = getUserBookings(user.uid);
            renderBookings(updatedBookings);
          }
        }
      });
    });
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      document.getElementById('bookingsContent').innerHTML = `
                <div class="bookings-empty">
                    <i class="fas fa-lock" style="font-size: 64px; color: var(--border-light); margin-bottom: 20px;"></i>
                    <p style="font-size: 18px; margin-bottom: 20px;">Войдите в аккаунт, чтобы увидеть свои бронирования</p>
                    <a href="fireBaseApp.html" class="action-button action-button--primary">Войти</a>
                </div>
            `;
    } else {
      const bookings = getUserBookings(user.uid);
      renderBookings(bookings);
    }
  });
</script>
</body>
</html>
